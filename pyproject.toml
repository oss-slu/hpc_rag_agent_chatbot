[project]
name = "slu-hpc-rag"
version = "0.0.1"
description = "A retrieval-augmented assistant that answers questions about SLU's HPC cluster from its official documentation."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langchain>=1.0",
    "langchain-anthropic>=1.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
]

[project.scripts]
slu-hpc-rag-migrate = "slu_hpc_rag.db:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slu_hpc_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a Postgres+pgvector database (set TEST_DATABASE_URL)"]

[tool.coverage.run]
source = ["slu_hpc_rag"]
omit = ["*/slu_hpc_rag/main.py"]  # one-line ASGI entry point

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
