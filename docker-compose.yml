services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: hpc
      POSTGRES_PASSWORD: hpc          # local development only
      POSTGRES_DB: hpc_rag
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hpc", "-d", "hpc_rag"]
      interval: 3s
      retries: 20

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://hpc:hpc@db:5432/hpc_rag
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
