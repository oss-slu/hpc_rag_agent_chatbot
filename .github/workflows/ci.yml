name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  data-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No SLU docs, snapshots, data or secrets in this public repo
        run: bash scripts/check-no-slu-data.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: hpc
          POSTGRES_PASSWORD: hpc
          POSTGRES_DB: hpc_rag_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hpc"
          --health-interval 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://hpc:hpc@localhost:5432/hpc_rag_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # All dependency groups: the UI tests need Streamlit from the "ui" group.
      - run: uv sync --locked --all-groups
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests (including database)
        run: uv run pytest --cov --cov-report=term-missing

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: API image
        run: docker build -t slu-hpc-rag:ci .
      - name: Chat UI image
        if: hashFiles('ui/Dockerfile') != ''  # once the UI is on main
        run: docker build -f ui/Dockerfile -t slu-hpc-rag-ui:ci .
