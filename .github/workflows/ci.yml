name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: hpc
          POSTGRES_PASSWORD: hpc
          POSTGRES_DB: hpc_rag_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hpc"
          --health-interval 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://hpc:hpc@localhost:5432/hpc_rag_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests (including database)
        run: uv run pytest --cov --cov-report=term-missing

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t slu-hpc-rag:ci .
